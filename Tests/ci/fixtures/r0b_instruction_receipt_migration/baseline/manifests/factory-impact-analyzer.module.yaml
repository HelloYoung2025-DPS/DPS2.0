{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "factory-impact-analyzer",
    "name": "Factory Impact Analyzer",
    "version": "0.2.0",
    "description": "Consumes sealed upgrade.intent/v2 and instruction.receipt/v2 capabilities, independently recomputes exact-major read impact, preserves exact write permissions, and emits non-authorizing module.change.plan/v2; portable cross-process trust remains WAITING_EXTERNAL.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-impact-analyzer",
    "canonicalRoot": "modules/factory-impact-analyzer",
    "owned": ["Modules/factory-impact-analyzer/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.factory-impact-analyzer",
      "kind": "service",
      "status": "proposed",
      "build": "python3.12 -m unittest discover -s Modules/factory-impact-analyzer/tests -p 'test_*.py'",
      "versioning": "semver"
    },
    {
      "id": "dps.factory-impact-analyzer.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": "python3.12 -m unittest Modules/factory-impact-analyzer/tests/test_contracts.py",
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "CPython 3.12.13",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-impact-analyzer/src/impact_analyzer.py"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "module.change.plan",
        "major": 1,
        "source": "Modules/factory-impact-analyzer/contracts/provided/module.change.plan.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-impact-analyzer"
      },
      {
        "contractId": "module.change.plan",
        "major": 2,
        "source": "Modules/factory-impact-analyzer/contracts/provided/module.change.plan.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-impact-analyzer"
      }
    ],
    "consumed": [
      {
        "contractId": "upgrade.intent",
        "major": 1,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-upgrade-intake"
      },
      {
        "contractId": "upgrade.intent",
        "major": 2,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-upgrade-intake"
      },
      {
        "contractId": "instruction.receipt",
        "major": 1,
        "source": "Modules/factory-instruction-resolver/contracts/provided/instruction.receipt.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-instruction-resolver"
      },
      {
        "contractId": "instruction.receipt",
        "major": 2,
        "source": "Modules/factory-instruction-resolver/contracts/provided/instruction.receipt.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-instruction-resolver"
      }
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "factory-upgrade-intake",
        "contractId": "upgrade.intent",
        "major": 2,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "none-validation-is-deterministic",
        "idempotencyKey": "intent_id:upgrade_intent_sha256",
        "authScope": "factory:impact-analyzer",
        "failureMode": "fail-closed-and-quarantine-intent"
      },
      {
        "peerModule": "factory-instruction-resolver",
        "contractId": "instruction.receipt",
        "major": 2,
        "direction": "inbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-receipt-id-and-source-upgrade-intent-sha256",
        "idempotencyKey": "receipt_id:source_upgrade_intent_sha256",
        "authScope": "factory:instruction-receipt:read",
        "failureMode": "retain-receipt-and-retry"
      }
    ],
    "outbound": [
      {
        "peerModule": "factory-worktree-manager",
        "contractId": "module.change.plan",
        "major": 2,
        "direction": "outbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "same-plan-id-and-plan-sha256",
        "idempotencyKey": "plan_id:plan_sha256",
        "authScope": "factory:worktree-plan",
        "failureMode": "retain-plan-and-stop-scheduling"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "module.change.plan",
        "major": 2,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-plan-id-and-plan-sha256",
        "idempotencyKey": "plan_id:plan_sha256",
        "authScope": "factory:host:orchestrate",
        "failureMode": "stop-on-conflict-or-nonportable-trust"
      }
    ]
  },
  "dependencies": [
    {
      "moduleId": "factory-upgrade-intake",
      "versionRange": ">=0.2.0 <1.0.0",
      "required": true,
      "reason": "sealed canonical upgrade.intent/v2 and full request digest"
    },
    {
      "moduleId": "factory-instruction-resolver",
      "versionRange": ">=0.4.0 <1.0.0",
      "required": true,
      "reason": "sealed current instruction.receipt/v2, exact write paths and baseline facts"
    }
  ],
  "permissions": {
    "allowed": [
      "read registered Manifests, exact-major contracts and Git metadata",
      "verify process-bound v2 Intent, Receipt and stable-policy capabilities",
      "compute deterministic dependency waves and a non-authorizing plan"
    ],
    "denied": [
      "worktree mutation",
      "scope or write-permission expansion",
      "role self-assignment",
      "arbitrary shell",
      "evidence issuance",
      "release approval",
      "production side effects"
    ],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": ["registered module metadata", "exact-major contract graph", "Git baseline and diff state"],
    "privacyClasses": ["internal"],
    "retention": "plans belong in the external immutable Factory evidence store; process-local capabilities are not durable trust",
    "export": "export deterministic plan metadata and hashes without source content or trust keys",
    "correction": "re-resolve the Intent and emit a new plan; never rewrite a prior plan",
    "deletion": "retain non-sensitive audit hashes under the Factory retention policy"
  },
  "security": {
    "trustBoundaries": [
      "Git object database and current index/worktree",
      "registered module governance and exact contract declarations",
      "fixed process composition root",
      "WAITING_EXTERNAL portable cross-process trust provider"
    ],
    "secretScopes": [],
    "untrustedInputs": [
      "plain Intent or Receipt JSON",
      "future contract expectations",
      "requested paths",
      "repository files and Git diff",
      "caller-supplied time, verifier, roles, risk or stage"
    ],
    "failClosedOn": [
      "v1 or unknown major runtime input",
      "plain Mapping, lambda verifier, direct capability construction or cross-authority capability",
      "same trust receipt with different bytes or authority binding",
      "raw bytes, full digest, issuer, audience, nonce, generation, producer or major mutation",
      "expiry equality or expired upstream/local authority",
      "Intent/Receipt identity, digest, authority, approval, risk or stage mismatch",
      "baseline facts mixed with UNVERIFIED_EXPECTATIONS",
      "scope that has one module too many or too few",
      "write paths outside exact requested targets",
      "unknown, overlapping or racing path ownership",
      "unknown exact-major owner, consumer or contract declaration",
      "quarantine-only or retired runtime communication",
      "dependency cycle",
      "Git HEAD, index, diff, bound file or Manifest TOCTOU",
      "non-production policy production-stage escalation"
    ],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-impact-analyzer.unit",
        "type": "unit",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-impact-analyzer/tests/test_impact_analyzer.py",
        "environment": "CPython 3.12 with hash-locked jsonschema; isolated temporary Git repositories; real Intake-to-Resolver-to-Impact four-kind pipeline; multi-change ordering, authority, receipt/nonce and source-metadata replay, causal time, expiry, exact-major, scope, TOCTOU, deterministic and no-side-effect attacks",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-impact-analyzer.contract",
        "type": "contract",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-impact-analyzer/tests/test_contracts.py",
        "environment": "CPython 3.12 with hash-locked jsonschema; Draft 2020-12 v2 outputs, hash recomputation, four change kinds, release escalation negatives and frozen v1 bytes",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {
      "upgrade.intent": [1, 2],
      "instruction.receipt": [1, 2],
      "module.change.plan": [1, 2]
    },
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_impact_analyzer_v2",
    "canary": "shadow-only process-local Intake-to-Resolver-to-Impact comparison with zero product or repository side effects; portable trust remains WAITING_EXTERNAL",
    "rollback": "discard all unexecuted v2 plans and route the compatibility group to the previous signed BOM within five minutes; never reactivate v1 runtime inputs",
    "killSwitch": "factory_disable_impact_analysis"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "REPOSITORY_STATIC_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true,
    "resolver": "factory-instruction-resolver"
  }
}
