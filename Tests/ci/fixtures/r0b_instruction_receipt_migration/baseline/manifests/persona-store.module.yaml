{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "persona-store",
    "name": "Persona Store",
    "version": "0.4.0",
    "description": "Soul-scoped append-only persona revisions, keyed non-enumerable commitments, exact current reads, and audited live-primary logical deletion backed by PostgreSQL; final cryptographic erasure is not implemented.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R2",
    "ownerId": "dps-soul"
  },
