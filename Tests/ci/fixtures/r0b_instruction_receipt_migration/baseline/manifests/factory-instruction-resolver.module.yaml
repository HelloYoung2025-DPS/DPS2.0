{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "factory-instruction-resolver",
    "name": "Factory Instruction Resolver",
    "version": "0.4.0",
    "description": "Issues process-bound capabilities over Schema-validated instruction.receipt/v2 bytes, exact authorized write paths, exact-major instructions, baseline facts, Git state, and read-impact scope; portable cross-process trust remains WAITING_EXTERNAL.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-instruction-resolver",
    "canonicalRoot": "modules/factory-instruction-resolver",
    "owned": ["Modules/factory-instruction-resolver/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.factory-instruction-resolver",
      "kind": "service",
      "status": "proposed",
      "build": "python3.12 -m unittest discover -s Modules/factory-instruction-resolver/tests -p 'test_*.py'",
      "versioning": "semver"
    },
    {
      "id": "dps.factory-instruction-resolver.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": "python3.12 -m unittest Modules/factory-instruction-resolver/tests/test_contracts.py",
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "CPython 3.12.13",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-instruction-resolver/src/instruction_resolver.py"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "instruction.receipt",
        "major": 1,
        "source": "Modules/factory-instruction-resolver/contracts/provided/instruction.receipt.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-instruction-resolver"
      },
      {
        "contractId": "instruction.receipt",
        "major": 2,
        "source": "Modules/factory-instruction-resolver/contracts/provided/instruction.receipt.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-instruction-resolver"
      }
    ],
    "consumed": [
      {
        "contractId": "upgrade.intent",
        "major": 1,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-upgrade-intake"
      },
      {
        "contractId": "upgrade.intent",
        "major": 2,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-upgrade-intake"
      }
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "factory-upgrade-intake",
        "contractId": "upgrade.intent",
        "major": 2,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "same-intent-id-and-upgrade-intent-sha256",
        "idempotencyKey": "intent_id:upgrade_intent_sha256",
        "authScope": "factory:instruction-resolver",
        "failureMode": "fail-closed-and-quarantine-intent"
      }
    ],
    "outbound": [
      {
        "peerModule": "factory-impact-analyzer",
        "contractId": "instruction.receipt",
        "major": 2,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-receipt-id-and-source-upgrade-intent-sha256",
        "idempotencyKey": "receipt_id:source_upgrade_intent_sha256",
        "authScope": "factory:instruction-receipt:read",
        "failureMode": "retain-receipt-and-retry"
      },
      {
        "peerModule": "factory-worktree-manager",
        "contractId": "instruction.receipt",
        "major": 2,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-receipt-id-and-source-upgrade-intent-sha256",
        "idempotencyKey": "receipt_id:source_upgrade_intent_sha256",
        "authScope": "factory:instruction-receipt:read",
        "failureMode": "retain-receipt-and-retry"
      },
      {
        "peerModule": "factory-trusted-runner",
        "contractId": "instruction.receipt",
        "major": 2,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-receipt-id-and-source-upgrade-intent-sha256",
        "idempotencyKey": "receipt_id:source_upgrade_intent_sha256",
        "authScope": "factory:instruction-receipt:read",
        "failureMode": "retain-receipt-and-retry"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "instruction.receipt",
        "major": 2,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-receipt-id-and-source-upgrade-intent-sha256",
        "idempotencyKey": "receipt_id:source_upgrade_intent_sha256",
        "authScope": "factory:host:orchestrate",
        "failureMode": "mark-stale-or-quarantine"
      }
    ]
  },
  "dependencies": [
    {
      "moduleId": "factory-upgrade-intake",
      "versionRange": ">=0.2.0 <1.0.0",
      "required": true,
      "reason": "sealed requester and Manifest authority proofs plus canonical upgrade.intent/v2"
    }
  ],
  "permissions": {
    "allowed": [
      "read repository instructions and Git metadata",
      "verify process-bound canonical Intake attestations",
      "issue bounded process-local receipt currentness capabilities",
      "hash registered Manifests and contracts",
      "verify exact baseline contract facts"
    ],
    "denied": [
      "product repository mutation",
      "arbitrary shell",
      "test evidence issuance",
      "release approval",
      "production secrets"
    ],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": ["registered module metadata and Git object identity"],
    "privacyClasses": ["internal"],
    "retention": "receipts belong in the external immutable Factory evidence store",
    "export": "export hashes and repository-relative paths without source content",
    "correction": "create a new receipt; never rewrite a bound receipt",
    "deletion": "retain non-sensitive audit hashes under the Factory retention policy"
  },
  "security": {
    "trustBoundaries": [
      "Git object database",
      "registered module governance",
      "sealed Upgrade Intake authority proofs"
    ],
    "secretScopes": [],
    "untrustedInputs": [
      "upgrade intent",
      "diff paths",
      "repository file content",
      "authorization claims",
      "optimistic contract change expectations"
    ],
    "failClosedOn": [
      "stale hash",
      "expanded or racing diff",
      "missing exact-major consumer",
      "path traversal, glob, or symlink",
      "unknown or missing major or mode",
      "invalid authority proof binding",
      "cache lookup before complete attestation re-verification",
      "plain Mapping or cross-authority Intake capability",
      "plain receipt JSON, direct receipt capability construction, or cross-Resolver capability",
      "receipt capability raw bytes, issuer, audience, expiry, nonce, or generation mutation",
      "expired Intake, auth, Manifest, or approval proof",
      "impossible receipt calendar date or expiry equality",
      "active trust or capability state quota exhaustion",
      "write scope inferred from read-impact scope",
      "schema-invalid, non-BOUND, or non-canonical receipt currentness input",
      "communication direction inconsistent with Schema producer",
      "full upgrade intent digest mismatch",
      "false baseline fact",
      "quarantined major with runtime communication"
    ],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-instruction-resolver.unit",
        "type": "unit",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-instruction-resolver/tests/test_instruction_resolver.py",
        "environment": "CPython 3.12 with hash-locked jsonschema; temporary Git repositories; Intake and receipt capabilities, cache re-verification, authority separation, bounded expiry state, write-scope, exact-major, baseline-fact, Schema-valid stale, tamper, and controlled race attacks",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-instruction-resolver.contract",
        "type": "contract",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-instruction-resolver/tests/test_contracts.py",
        "environment": "CPython 3.12 with hash-locked jsonschema; real Intake-to-Resolver parity, four digest domains, Draft 2020-12 receipt v2, dependency-free calendar truth, expiry equality, four change kinds, canonical paths, and frozen v1 bytes",
        "evidenceLevel": "CONTRACT_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {
      "upgrade.intent": [1, 2],
      "instruction.receipt": [1, 2]
    },
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_instruction_resolver_v2",
    "canary": "shadow-bind sealed v2 intents and real repository diffs without authorizing writes; v1 remains quarantine-only",
    "rollback": "route to the previous signed Factory BOM and invalidate receipts created after cutover within five minutes",
    "killSwitch": "factory_disable_instruction_binding"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "CONTRACT_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true,
    "resolver": "factory-instruction-resolver"
  }
}
