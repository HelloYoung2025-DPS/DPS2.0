{
  "schemaVersion": "dps.module/v2",
  "module": {
    "id": "soul-memory-adapter",
    "name": "Soul Memory Adapter",
    "version": "0.2.0",
    "description": "Fail-closed SoulMemory adapter for exact GBrain Company OAuth/MCP projection, read-back, search revalidation, Persona-current, soft-delete, and rebuild operations.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-soul"
  },
  "paths": {
    "actualRoot": "Modules/soul-memory-adapter",
    "canonicalRoot": "modules/soul-memory-adapter",
    "owned": ["Modules/soul-memory-adapter/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.soul-memory-adapter",
      "kind": "assembly",
      "status": "proposed",
      "build": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/src/Dps.SoulMemoryAdapter/Dps.SoulMemoryAdapter.csproj --locked-mode && scripts/dotnet-pinned.sh build Modules/soul-memory-adapter/src/Dps.SoulMemoryAdapter/Dps.SoulMemoryAdapter.csproj --configuration Release --no-restore",
      "versioning": "semver"
    },
    {
      "id": "dps.soul-memory-adapter.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/contracts/Dps.SoulMemoryAdapter.Contracts/Dps.SoulMemoryAdapter.Contracts.csproj --locked-mode && scripts/dotnet-pinned.sh build Modules/soul-memory-adapter/contracts/Dps.SoulMemoryAdapter.Contracts/Dps.SoulMemoryAdapter.Contracts.csproj --configuration Release --no-restore",
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "C# 14",
    "target": "net10.0",
    "processBoundary": "modular-monolith",
    "entrypoints": ["Modules/soul-memory-adapter/src/Dps.SoulMemoryAdapter/GBrainCompanySoulMemoryClient.cs"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "soul.memory.readback",
        "major": 1,
        "source": "Modules/soul-memory-adapter/contracts/provided/soul.memory.readback.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "soul-memory-adapter"
      }
    ],
    "consumed": [
      {
        "contractId": "gbrain.projection",
        "major": 1,
        "source": "Modules/gbrain-projector/contracts/provided/gbrain.projection.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "gbrain-projector"
      }
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "gbrain-projector",
        "contractId": "gbrain.projection",
        "major": 1,
        "direction": "inbound",
        "transport": "soul-memory-adapter",
        "timeoutMs": 5000,
        "retryPolicy": "identical-projection-redelivery-after-exact-readback-reconciliation-only",
        "idempotencyKey": "soul_id:source_id:projection_revision",
        "authScope": "module:gbrain-projector",
        "failureMode": "fail-closed-and-retain-unverified-state"
      }
    ],
    "outbound": [
      {
        "peerModule": "control-plane-host",
        "contractId": "soul.memory.readback",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "identical-verified-receipt-redelivery",
        "idempotencyKey": "soul_id:source_id:projection_revision",
        "authScope": "module:control-plane-host",
        "failureMode": "fail-closed-and-retain-unverified-state"
      }
    ]
  },
  "dependencies": [
    {
      "moduleId": "gbrain-projector",
      "versionRange": ">=0.1.0 <1.0.0",
      "required": true,
      "reason": "sole versioned Source binding and projection revision/checksum truth"
    }
  ],
  "permissions": {
    "allowed": [
      "validate-gbrain-projection",
      "preserve-projection-binding",
      "exact-readback-verification",
      "fixed-https-oauth-protected-resource-and-authorization-server-discovery",
      "per-soul-oauth-client-credentials-from-external-secret-source",
      "durable-atomic-per-soul-mutation-journal",
      "versioned-delete-and-rebuild-intents",
      "durable-fenced-loss-signalling-per-soul-mutation-lease",
      "fixed-mcp-get-put-search-soft-delete-restore-and-whoami"
    ],
    "denied": [
      "caller-selected URL or MCP tool name",
      "dynamic client registration",
      "admin or federation scope",
      "hard purge or erasure claim",
      "GBrain credential in repository, contracts, logs, or prompts",
      "raw email or phone",
      "gs_<digest> evidence alias as GBrain Source",
      "device command",
      "production shell"
    ],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": [
      "prepared-projection-binding-by-exact-soul-source-and-revision",
      "verified-readback-receipt"
    ],
    "privacyClasses": ["personal", "sensitive"],
    "retention": "prepared DTOs are transient; receipts follow Control Plane audit retention; GBrain retention is operator policy outside this module",
    "export": "export exact scoped checksums and source identifiers without credentials",
    "correction": "consume a corrected gbrain.projection/v1 revision; never mutate a verified receipt",
    "deletion": "soft-delete and exact include-deleted verification are supported; hard purge, chunk, embedding, cache, and backup erasure remain explicitly unverified"
  },
  "security": {
    "trustBoundaries": [
      "gbrain.projection/v1 to per-Soul fixed GBrain Source",
      "external secret source to zeroized transient OAuth credential lease",
      "Control Plane durable mutation journal and fenced loss-signalling per-Soul mutation lease to GBrain side effects",
      "RFC 9728 protected-resource metadata to RFC 8414 or OIDC authorization-server discovery",
      "untrusted MCP capability, page, search, and read-back payloads to exact verifier"
    ],
    "secretScopes": ["per-Soul OAuth client credentials with exactly read and write"],
    "untrustedInputs": [
      "gbrain.projection/v1 payload",
      "OAuth metadata and token response",
      "MCP initialize and tools/list response",
      "MCP tool result and SSE event",
      "read-back and search payload",
      "source identifier",
      "schema",
      "contract",
      "revision",
      "checksum",
      "timestamps"
    ],
    "failClosedOn": [
      "unknown contract major",
      "scope, Soul, device, account, or source mismatch",
      "schema, contract, revision, checksum, provenance, or freshness mismatch",
      "conflicting idempotency key",
      "scope-only, stale, or target-mismatched delete intent",
      "unresolved prior mutation or lost mutation fence",
      "credential or whoami scope mismatch",
      "untrusted issuer, audience, token endpoint, redirect, or plaintext production URL",
      "dynamic registration or unexpected OAuth grant",
      "unsupported MCP version, capability drift, unknown tool result, or oversized response",
      "unknown mutating outcome without exact successful reconciliation"
    ],
    "policyIds": [
      "SOUL-ISO-001",
      "CMD-IDEMP-001",
      "RESULT-VERIFY-001",
      "GBRAIN-READBACK-001",
      "EDGE-NORESTART-001"
    ]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "soul-memory-adapter.schema-corpus",
        "type": "contract",
        "required": true,
        "command": "python3.12 -m unittest discover -s Modules/soul-memory-adapter/tests -p test_readback_schema_corpus.py",
        "environment": "locked requirements-ci.txt jsonschema Draft 2020-12 with active format checking; isolated discovery of exactly three provider-owned tests",
        "evidenceLevel": "CONTRACT_VERIFIED"
      },
      {
        "id": "soul-memory-adapter.unit",
        "type": "unit",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --locked-mode && scripts/dotnet-pinned.sh test Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --configuration Release --no-restore -- --filter-trait Category=Unit --minimum-expected-tests 5 --fail-skips on",
        "environment": "macos-or-hosted deterministic adapter; no public GBrain, device, or secret access",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "soul-memory-adapter.contract",
        "type": "contract",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --locked-mode && scripts/dotnet-pinned.sh test Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --configuration Release --no-restore -- --filter-trait Category=Contract --minimum-expected-tests 5 --fail-skips on",
        "environment": "macos-or-hosted deterministic codec, public contract, and pinned capability-fixture checks",
        "evidenceLevel": "CONTRACT_VERIFIED"
      },
      {
        "id": "soul-memory-adapter.gbrain-loopback-protocol",
        "type": "integration",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --locked-mode && scripts/dotnet-pinned.sh test Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --configuration Release --no-restore -- --filter-trait Category=SecuritySimulation --minimum-expected-tests 23 --fail-skips on",
        "environment": "SIMULATION only: in-process GBrain HTTP/OAuth/MCP security protocol; no socket, public network, credential, GBrain Company, Windows, ZennoDroid, or phone; cannot satisfy real-GBrain or device gates",
        "evidenceLevel": "INTEGRATION_VERIFIED"
      },
      {
        "id": "soul-memory-adapter.postgres-integration",
        "type": "integration",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --locked-mode && scripts/dotnet-pinned.sh test Modules/soul-memory-adapter/tests/Dps.SoulMemoryAdapter.Tests/Dps.SoulMemoryAdapter.Tests.csproj --configuration Release --no-restore -- --filter-trait Category=Integration --minimum-expected-tests 9 --fail-skips on",
        "environment": "PostgreSQL 18.4 local offline_projection_fixture via DPS_TEST_POSTGRES; live_gbrain=false; missing database is a failure",
        "evidenceLevel": "INTEGRATION_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "modern",
    "moduleMajor": 0,
    "supportedContractMajors": {
      "gbrain.projection": [1],
      "soul.memory.readback": [1]
    },
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "soul_memory_gbrain_company_v1",
    "canary": "shadow and exact-read-only until signed real-GBrain evidence exists; then two non-production Souls before any broader rollout",
    "rollback": "disable new writes, preserve exact reads for reconciliation, restore the previous signed BOM, and never retry an unknown mutation blindly",
    "killSwitch": "kill_soul_memory_gbrain_company"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "INTEGRATION_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true
  }
}
