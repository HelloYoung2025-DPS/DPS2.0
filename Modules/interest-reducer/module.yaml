{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "interest-reducer",
    "name": "Interest Reducer",
    "version": "0.1.0",
    "description": "Pure deterministic reduction of verified MemoryEvents into decayed InterestSnapshots.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R2",
    "ownerId": "dps-platform"
  },
  "paths": {
    "actualRoot": "Modules/interest-reducer",
    "canonicalRoot": "modules/interest-reducer",
    "owned": [
      "Modules/interest-reducer/**"
    ],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.interest-reducer",
      "kind": "assembly",
      "status": "proposed",
      "build": "scripts/dotnet-pinned.sh restore Modules/interest-reducer/src --locked-mode && scripts/dotnet-pinned.sh build Modules/interest-reducer/src --configuration Release --no-restore",
      "versioning": "semver"
    },
    {
      "id": "dps.interest-reducer.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": "scripts/dotnet-pinned.sh restore Modules/interest-reducer/contracts --locked-mode && scripts/dotnet-pinned.sh build Modules/interest-reducer/contracts --configuration Release --no-restore",
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "C# 14",
    "target": "net10.0",
    "processBoundary": "modular-monolith",
    "entrypoints": [],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "interest.snapshot",
        "major": 1,
        "source": "Modules/interest-reducer/contracts/provided/interest.snapshot.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "interest-reducer"
      }
    ],
    "consumed": [
      {
        "contractId": "memory.event",
        "major": 1,
        "source": "Modules/memory-event-ledger/contracts/provided/memory.event.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "memory-event-ledger"
      }
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "memory-event-ledger",
        "contractId": "memory.event",
        "major": 1,
        "direction": "inbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "bounded-exponential-with-jitter",
        "idempotencyKey": "trace_id:idempotency_key",
        "authScope": "module:memory-event-ledger",
        "failureMode": "fail-closed-and-record-evidence"
      }
    ],
    "outbound": [
      {
        "peerModule": "gbrain-projector",
        "contractId": "interest.snapshot",
        "major": 1,
        "direction": "outbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "bounded-exponential-with-jitter",
        "idempotencyKey": "trace_id:idempotency_key",
        "authScope": "module:gbrain-projector",
        "failureMode": "fail-closed-and-record-evidence"
      },
      {
        "peerModule": "evidence-service",
        "contractId": "interest.snapshot",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "bounded-exponential-with-jitter",
        "idempotencyKey": "trace_id:idempotency_key",
        "authScope": "module:evidence-service",
        "failureMode": "fail-closed-and-record-evidence"
      }
    ]
  },
  "dependencies": [
    {
      "moduleId": "memory-event-ledger",
      "versionRange": ">=0.1.0 <1.0.0",
      "required": true,
      "reason": "verified append-only event input"
    }
  ],
  "permissions": {
    "allowed": [
      "cpu:pure-reduction",
      "postgresql:interest"
    ],
    "denied": [
      "GBrain network",
      "device command",
      "model output execution",
      "production shell"
    ],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [
      "postgresql:interest.snapshots"
    ],
    "readModels": [
      "current-interest-by-soul"
    ],
    "privacyClasses": [
      "personal"
    ],
    "retention": "derived snapshots retained while source events are retained",
    "export": "Soul-scoped snapshot with evidence references",
    "correction": "deterministic replay from corrected source events",
    "deletion": "delete derived snapshots after source erasure and rebuild remaining state"
  },
  "security": {
    "trustBoundaries": [
      "module API and versioned contract boundary"
    ],
    "secretScopes": [],
    "untrustedInputs": [
      "contract payloads",
      "stored text",
      "timestamps"
    ],
    "failClosedOn": [
      "unknown contract major",
      "invalid identity scope",
      "missing evidence"
    ],
    "policyIds": [
      "SOUL-ISO-001",
      "CMD-IDEMP-001",
      "RESULT-VERIFY-001",
      "GBRAIN-READBACK-001",
      "EDGE-NORESTART-001"
    ]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": [
      "FAIL",
      "SKIP",
      "PARTIAL",
      "NOT_RUN",
      "INFRA_ERROR",
      "NOT_APPLICABLE"
    ],
    "suites": [
      {
        "id": "interest-reducer.unit",
        "type": "unit",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/interest-reducer/tests --locked-mode && scripts/dotnet-pinned.sh test --project Modules/interest-reducer/tests --configuration Release --no-restore --filter-trait Category=Unit --minimum-expected-tests 1 --fail-skips on",
        "environment": "macos-or-hosted",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "interest-reducer.contract",
        "type": "contract",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/interest-reducer/tests --locked-mode && scripts/dotnet-pinned.sh test --project Modules/interest-reducer/tests --configuration Release --no-restore --filter-trait Category=Contract --minimum-expected-tests 1 --fail-skips on",
        "environment": "macos-or-hosted",
        "evidenceLevel": "CONTRACT_VERIFIED"
      },
      {
        "id": "interest-reducer.integration",
        "type": "integration",
        "required": true,
        "command": "scripts/dotnet-pinned.sh restore Modules/interest-reducer/tests --locked-mode && scripts/dotnet-pinned.sh test --project Modules/interest-reducer/tests --configuration Release --no-restore --filter-trait Category=Integration --minimum-expected-tests 1 --fail-skips on",
        "environment": "PostgreSQL 18.4 local integration",
        "evidenceLevel": "INTEGRATION_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "modern",
    "moduleMajor": 0,
    "supportedContractMajors": {
      "interest.snapshot": [
        1
      ],
      "memory.event": [
        1
      ]
    },
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "interest_reducer_v1",
    "canary": "synthetic then shadow then bounded Soul cohort",
    "rollback": "disable feature flag and restore previous signed Release BOM",
    "killSwitch": "kill_interest_reducer"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "INTEGRATION_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true,
    "resolver": "factory-instruction-resolver"
  }
}
