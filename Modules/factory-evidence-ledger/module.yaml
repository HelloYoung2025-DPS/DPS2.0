{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "factory-evidence-ledger",
    "name": "Factory Evidence Ledger",
    "version": "0.2.0",
    "description": "Authenticated exact-byte append, append-only storage, redacted conflict quarantine, and full-field upgrade-event replay.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-evidence-ledger",
    "canonicalRoot": "modules/factory-evidence-ledger",
    "owned": ["Modules/factory-evidence-ledger/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.factory-evidence-ledger",
      "kind": "service",
      "status": "proposed",
      "build": "python3.12 -m compileall -q Modules/factory-evidence-ledger/src",
      "versioning": "semver"
    },
    {
      "id": "dps.factory-evidence-ledger.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": null,
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "cpython-3.12; psycopg[binary] 3.3.4 from root requirements-ci.txt hash lock; PostgreSQL 18; fixed external HMAC append authority",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-evidence-ledger/src/evidence_ledger.py"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "upgrade.event.append",
        "major": 1,
        "source": "Modules/factory-evidence-ledger/contracts/provided/upgrade.event.append.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-evidence-ledger"
      },
      {
        "contractId": "upgrade.event",
        "major": 1,
        "source": "Modules/factory-evidence-ledger/contracts/provided/upgrade.event.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-evidence-ledger"
      }
    ],
    "consumed": []
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "factory-release-controller",
        "contractId": "upgrade.event.append",
        "major": 1,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-same-idempotency-key",
        "idempotencyKey": "stream_id:idempotency_key",
        "authScope": "factory:evidence:append",
        "failureMode": "fail-closed-on-sequence-or-payload-conflict"
      },
      {
        "peerModule": "factory-rollback-controller",
        "contractId": "upgrade.event.append",
        "major": 1,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-same-idempotency-key",
        "idempotencyKey": "stream_id:idempotency_key",
        "authScope": "factory:evidence:append",
        "failureMode": "fail-closed-on-sequence-or-payload-conflict"
      }
    ],
    "outbound": [
      {
        "peerModule": "factory-release-controller",
        "contractId": "upgrade.event",
        "major": 1,
        "direction": "outbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "ordered-at-least-once-by-sequence",
        "idempotencyKey": "event_id",
        "authScope": "factory:evidence:read",
        "failureMode": "consumer-replays-from-last-sequence"
      },
      {
        "peerModule": "factory-rollback-controller",
        "contractId": "upgrade.event",
        "major": 1,
        "direction": "outbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "ordered-at-least-once-by-sequence",
        "idempotencyKey": "event_id",
        "authScope": "factory:evidence:read",
        "failureMode": "consumer-replays-from-last-sequence"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "upgrade.event",
        "major": 1,
        "direction": "outbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "ordered-replay",
        "idempotencyKey": "event_id",
        "authScope": "factory:host:evidence",
        "failureMode": "stop-on-hash-or-sequence-break"
      }
    ]
  },
  "dependencies": [],
  "permissions": {
    "allowed": ["postgresql:factory_evidence protected functions", "verify fixed-authority exact-byte append capability", "append immutable upgrade events", "replay owned stream"],
    "denied": ["caller-provided connection factory", "caller-selected database role", "direct runtime table write", "development file fixture in production", "update delete or truncate historical event", "approve release", "device command", "production shell"],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": ["postgresql:factory_evidence.upgrade_stream", "postgresql:factory_evidence.upgrade_event", "postgresql:factory_evidence.upgrade_event_quarantine", "postgresql:factory_evidence.append_auth_key_history"],
    "readModels": ["upgrade state reconstructed from ordered events"],
    "privacyClasses": ["internal"],
    "retention": "append-only evidence retained for BOM and audit support window",
    "export": "ordered redacted stream with payload and hash chain",
    "correction": "append a superseding event; never mutate history",
    "deletion": "personal payload is forbidden; audit metadata follows approved retention policy"
  },
  "security": {
    "trustBoundaries": ["fixed external append authority", "process-bound capability registry", "exact canonical command bytes", "fixed PostgreSQL runtime identity and protected functions", "event replay boundary"],
    "secretScopes": ["factory-evidence-ledger-db", "factory-evidence-ledger-append-hmac"],
    "untrustedInputs": ["append authorization envelope", "event payload", "sequence", "idempotency key", "timestamps", "file fixture bytes", "database projected columns and stream head"],
    "failClosedOn": ["missing external authentication", "unknown contract", "duplicate JSON member", "noncanonical JSON timestamp or number", "oversized or deeply nested payload", "capability copy swap expiry or revocation", "sequence conflict", "idempotency conflict", "file symlink hardlink partial line or concurrent corruption", "projected-column or stream-head drift", "hash-chain corruption", "database role ACL or transaction error"],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-evidence-ledger.unit",
        "type": "unit",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-evidence-ledger/src python3.12 -m unittest Modules/factory-evidence-ledger/tests/test_evidence_ledger.py",
        "environment": "Python 3.12 stdlib; PID-bound capability forgery copy raw-swap fork expiry revocation parallel-nonce strict-input and full-field replay attacks",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-evidence-ledger.crash-recovery",
        "type": "integration",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-evidence-ledger/src python3.12 -m unittest Modules/factory-evidence-ledger/tests/test_crash_recovery.py",
        "environment": "development-only no-follow locked JSONL fixture; real subprocess termination plus concurrent writer short-write path-swap symlink hardlink partial-line and tamper attacks; not PostgreSQL evidence",
        "evidenceLevel": "INTEGRATION_VERIFIED"
      },
      {
        "id": "factory-evidence-ledger.contract",
        "type": "contract",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-evidence-ledger/src python3.12 -m unittest discover -s Modules/factory-evidence-ledger/tests -p 'test_contracts.py'",
        "environment": "Python 3.12 and jsonschema from root requirements-ci.txt hash lock; byte-frozen public v1 schemas plus exact internal detached-auth envelope",
        "evidenceLevel": "CONTRACT_VERIFIED"
      },
      {
        "id": "factory-evidence-ledger.postgresql18",
        "type": "integration",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-evidence-ledger/src python3.12 -m unittest Modules/factory-evidence-ledger/tests/test_postgres_integration.py",
        "environment": "real PostgreSQL 18 via distinct DPS_TEST_POSTGRES_MIGRATION_URI DPS_TEST_POSTGRES_ADMIN_URI and DPS_TEST_POSTGRES_RUNTIME_URI identities, fixed external append key and epoch, psql, and locked psycopg; protected functions exact ACL append-only truncate and head consistency; any missing input is INFRA_ERROR",
        "evidenceLevel": "INTEGRATION_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {"upgrade.event.append": [1], "upgrade.event": [1]},
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_evidence_ledger_v1",
    "canary": "external-authenticated shadow with byte-for-byte command/event replay comparison before bounded routing",
    "rollback": "stop new capability issuance and writes, drain, verify command bytes sequence and stream head, and route to previous compatible writer; never delete events",
    "killSwitch": "kill_factory_evidence_ledger_writes"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "INTEGRATION_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.1.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true
  }
}
