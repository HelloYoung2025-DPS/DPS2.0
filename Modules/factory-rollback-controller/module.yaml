{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "factory-rollback-controller",
    "name": "Factory Rollback Controller",
    "version": "0.2.0",
    "description": "Orchestrates authorized bounded stop-route-drain-reconcile-switch rollback or verified explicit compensation.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-rollback-controller",
    "canonicalRoot": "modules/factory-rollback-controller",
    "owned": ["Modules/factory-rollback-controller/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {"id": "dps.factory-rollback-controller", "kind": "service", "status": "buildable", "build": "python3.12 -m compileall -q Modules/factory-rollback-controller/src", "versioning": "semver"},
    {"id": "dps.factory-rollback-controller.contracts", "kind": "contract-pack", "status": "buildable", "build": null, "versioning": "semver"}
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "cpython-3.12",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-rollback-controller/src/rollback_controller.py"],
    "toolchainStatus": "verified"
  },
  "contracts": {
    "provided": [
      {"contractId": "rollback.request", "major": 1, "source": "Modules/factory-rollback-controller/contracts/provided/rollback.request.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-rollback-controller"},
      {"contractId": "rollback.plan", "major": 1, "source": "Modules/factory-rollback-controller/contracts/provided/rollback.plan.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-rollback-controller"},
      {"contractId": "rollback.result", "major": 1, "source": "Modules/factory-rollback-controller/contracts/provided/rollback.result.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-rollback-controller"}
    ],
    "consumed": [
      {"contractId": "rollout.event", "major": 1, "source": "Modules/factory-release-controller/contracts/provided/rollout.event.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-release-controller"},
      {"contractId": "upgrade.event.append", "major": 1, "source": "Modules/factory-evidence-ledger/contracts/provided/upgrade.event.append.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-evidence-ledger"},
      {"contractId": "upgrade.event", "major": 1, "source": "Modules/factory-evidence-ledger/contracts/provided/upgrade.event.v1.schema.json", "status": "proposed", "mode": "active", "ownerModule": "factory-evidence-ledger"}
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "factory-release-controller",
        "contractId": "rollout.event",
        "major": 1,
        "direction": "inbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-by-rollout-event-id",
        "idempotencyKey": "rollout_event_id",
        "authScope": "factory:rollback:request",
        "failureMode": "deduplicate-or-quarantine-conflict"
      },
      {
        "peerModule": "factory-release-controller",
        "contractId": "rollback.request",
        "major": 1,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-by-rollback-id-and-request-hash",
        "idempotencyKey": "rollback_id:request_sha256",
        "authScope": "factory:rollback:request",
        "failureMode": "deduplicate-identical-or-quarantine-hash-conflict"
      },
      {
        "peerModule": "factory-evidence-ledger",
        "contractId": "upgrade.event",
        "major": 1,
        "direction": "inbound",
        "transport": "event",
        "timeoutMs": 5000,
        "retryPolicy": "ordered-replay-by-sequence",
        "idempotencyKey": "event_id",
        "authScope": "factory:evidence:read",
        "failureMode": "fail-closed-on-hash-or-sequence-break"
      }
    ],
    "outbound": [
      {
        "peerModule": "factory-evidence-ledger",
        "contractId": "upgrade.event.append",
        "major": 1,
        "direction": "outbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-same-idempotency-key",
        "idempotencyKey": "rollback_id:step",
        "authScope": "factory:evidence:append",
        "failureMode": "do-not-claim-completion-without-durable-result"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "rollback.plan",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "same-rollback-id-and-request-hash",
        "idempotencyKey": "rollback_id:request_sha256",
        "authScope": "factory:host:rollback",
        "failureMode": "retain-rollback-required"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "rollback.result",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 300000,
        "retryPolicy": "same-rollback-id-and-request-hash",
        "idempotencyKey": "rollback_id:request_sha256",
        "authScope": "factory:host:rollback",
        "failureMode": "retain-rollback-required"
      }
    ]
  },
  "dependencies": [
    {"moduleId": "factory-release-controller", "versionRange": ">=0.1.0 <1.0.0", "required": true, "reason": "versioned ROLLBACK_REQUIRED event and previous BOM reference"},
    {"moduleId": "factory-evidence-ledger", "versionRange": ">=0.1.0 <1.0.0", "required": true, "reason": "append-only plan and result evidence"}
  ],
  "permissions": {
    "allowed": ["stop declared routing", "drain declared work", "switch to previous signed BOM", "execute explicitly authorized compensation"],
    "denied": ["delete evidence", "claim external side effect rollback", "arbitrary production shell", "self-approve high-risk action"],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": ["rollback progress rebuilt from validated append-only upgrade events"],
    "privacyClasses": ["internal"],
    "retention": "plan and result evidence retained in factory-evidence-ledger",
    "export": "rollback.plan and rollback.result JSON",
    "correction": "append a new plan/result; never rewrite completed evidence",
    "deletion": "no personal payload is accepted"
  },
  "security": {
    "trustBoundaries": ["release event boundary", "previous signed BOM verifier", "operator compensation boundary"],
    "secretScopes": [],
    "untrustedInputs": ["rollback request", "rollout event", "request-reported approval or role", "step receipt", "drain status", "BOM digest", "external-effect declaration"],
    "failClosedOn": ["unknown contract", "untrusted approval or signature claim", "step order violation", "deadline exceeded", "incomplete drain", "unknown outcome", "BOM mismatch", "missing compensation", "evidence hash or sequence break"],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-rollback-controller.unit",
        "type": "unit",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-rollback-controller/src python3.12 -m unittest discover -s Modules/factory-rollback-controller/tests -p 'test_rollback_controller.py'",
        "environment": "Python 3.12 stdlib and logical clock",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-rollback-controller.contract",
        "type": "contract",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-rollback-controller/src python3.12 -m unittest discover -s Modules/factory-rollback-controller/tests -p 'test_contracts.py'",
        "environment": "Python 3.12 stdlib",
        "evidenceLevel": "CONTRACT_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {"rollback.request": [1], "rollback.plan": [1], "rollback.result": [1], "rollout.event": [1], "upgrade.event.append": [1], "upgrade.event": [1]},
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_rollback_controller_v1",
    "canary": "simulation-only failure injection before separately approved production rollback drill",
    "rollback": "route rollback requests to previous signed compatible controller; retain in-progress plan state",
    "killSwitch": "kill_factory_rollback_controller"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "CONTRACT_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true,
    "resolver": "factory-instruction-resolver"
  }
}
