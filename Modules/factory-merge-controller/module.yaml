{
  "schemaVersion": "dps.module/v1",
  "module": {
    "id": "factory-merge-controller",
    "name": "Factory Merge Controller",
    "version": "0.1.0",
    "description": "Deterministic merge-head verification and separation-of-duties decision service.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R2",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-merge-controller",
    "canonicalRoot": "modules/factory-merge-controller",
    "owned": ["Modules/factory-merge-controller/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.factory-merge-controller",
      "kind": "service",
      "status": "proposed",
      "build": "python3.12 -m compileall -q Modules/factory-merge-controller/src",
      "versioning": "semver"
    },
    {
      "id": "dps.factory-merge-controller.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": null,
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "cpython-3.12",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-merge-controller/src/merge_controller.py"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "merge.request",
        "major": 1,
        "source": "Modules/factory-merge-controller/contracts/provided/merge.request.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-merge-controller"
      },
      {
        "contractId": "merge.decision",
        "major": 1,
        "source": "Modules/factory-merge-controller/contracts/provided/merge.decision.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-merge-controller"
      }
    ],
    "consumed": [
      {
        "contractId": "trusted.test.result",
        "major": 1,
        "source": "Modules/factory-trusted-runner/contracts/provided/trusted.test.result.v1.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-trusted-runner"
      }
    ]
  },
  "communication": {
    "inbound": [
      {
        "peerModule": "factory-trusted-runner",
        "contractId": "merge.request",
        "major": 1,
        "direction": "inbound",
        "transport": "command",
        "timeoutMs": 30000,
        "retryPolicy": "caller-retries-same-idempotency-key",
        "idempotencyKey": "merge_request_id:merge_commit",
        "authScope": "factory:merge-request",
        "failureMode": "reject-and-record-reasons"
      }
    ],
    "outbound": [
      {
        "peerModule": "factory-artifact-builder",
        "contractId": "merge.decision",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-idempotent-receipt",
        "idempotencyKey": "decision_id",
        "authScope": "factory:merge-decision:read",
        "failureMode": "retain-decision-and-retry"
      },
      {
        "peerModule": "factory-release-controller",
        "contractId": "merge.decision",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 5000,
        "retryPolicy": "at-least-once-idempotent-receipt",
        "idempotencyKey": "decision_id",
        "authScope": "factory:merge-decision:read",
        "failureMode": "retain-decision-and-retry"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "merge.decision",
        "major": 1,
        "direction": "outbound",
        "transport": "receipt",
        "timeoutMs": 30000,
        "retryPolicy": "same-request-id-and-payload-sha256",
        "idempotencyKey": "workflow_id:request_id",
        "authScope": "factory:host:evidence",
        "failureMode": "reject-unapproved-merge"
      }
    ]
  },
  "dependencies": [
    {
      "moduleId": "factory-trusted-runner",
      "versionRange": ">=0.1.0 <1.0.0",
      "required": true,
      "reason": "independent merge-head test evidence"
    }
  ],
  "permissions": {
    "allowed": ["read merge-head evidence", "emit deterministic merge decision"],
    "denied": ["merge branches", "change tests", "sign artifacts", "approve release", "production shell"],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": ["merge request and immutable evidence receipts"],
    "privacyClasses": ["internal"],
    "retention": "decision retention is delegated to factory-evidence-ledger",
    "export": "versioned merge decision JSON",
    "correction": "issue a new decision for a new merge head",
    "deletion": "no personal payload is stored"
  },
  "security": {
    "trustBoundaries": ["authenticated factory command boundary", "independent evidence boundary"],
    "secretScopes": [],
    "untrustedInputs": ["merge metadata", "test evidence", "agent identities", "changed path lists"],
    "failClosedOn": ["unknown contract", "commit mismatch", "non-PASS required check", "role overlap", "path or contract conflict", "stale instructions"],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-merge-controller.unit",
        "type": "unit",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-merge-controller/src python3.12 -m unittest discover -s Modules/factory-merge-controller/tests -p 'test_merge_controller.py'",
        "environment": "Python 3.12 stdlib",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-merge-controller.contract",
        "type": "contract",
        "required": true,
        "command": "PYTHONPATH=Modules/factory-merge-controller/src python3.12 -m unittest discover -s Modules/factory-merge-controller/tests -p 'test_contracts.py'",
        "environment": "Python 3.12, jsonschema and referencing from root requirements-ci.txt hash lock; positive and adversarial contract instances",
        "evidenceLevel": "CONTRACT_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {"merge.request": [1], "merge.decision": [1], "trusted.test.result": [1]},
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_merge_controller_v1",
    "canary": "shadow compare decisions against independent human review; no production mutation",
    "rollback": "route requests to previous signed module artifact and retain decisions",
    "killSwitch": "kill_factory_merge_controller"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "CONTRACT_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true
  }
}
