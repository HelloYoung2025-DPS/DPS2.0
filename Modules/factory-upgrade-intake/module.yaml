{
  "schemaVersion": "dps.module/v2",
  "module": {
    "id": "factory-upgrade-intake",
    "name": "Factory Upgrade Intake",
    "version": "0.2.0",
    "description": "Validates Manifest-bound v2 REQUESTED upgrade claims, requester/approval receipts, scope and full intent digests; v1 is fixed-metadata quarantine-only.",
    "lifecycle": "proposed",
    "runtimeState": "proposed",
    "releaseEligible": false,
    "riskTier": "R3",
    "ownerId": "dps-ai-factory"
  },
  "paths": {
    "actualRoot": "Modules/factory-upgrade-intake",
    "canonicalRoot": "modules/factory-upgrade-intake",
    "owned": ["Modules/factory-upgrade-intake/**"],
    "excluded": [],
    "runtimeData": []
  },
  "artifacts": [
    {
      "id": "dps.factory-upgrade-intake",
      "kind": "service",
      "status": "proposed",
      "build": "python3.12 -m unittest discover -s Modules/factory-upgrade-intake/tests -p test_*.py",
      "versioning": "semver"
    },
    {
      "id": "dps.factory-upgrade-intake.contracts",
      "kind": "contract-pack",
      "status": "proposed",
      "build": "python3.12 -m unittest Modules/factory-upgrade-intake/tests/test_contracts.py",
      "versioning": "semver"
    }
  ],
  "runtime": {
    "track": "modern-service",
    "language": "Python 3.12",
    "target": "CPython 3.12.13",
    "processBoundary": "out-of-process",
    "entrypoints": ["Modules/factory-upgrade-intake/src/upgrade_intake.py"],
    "toolchainStatus": "proposed"
  },
  "contracts": {
    "provided": [
      {
        "contractId": "upgrade.intent",
        "major": 1,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v1.schema.json",
        "status": "deprecated",
        "mode": "quarantine-only",
        "ownerModule": "factory-upgrade-intake"
      },
      {
        "contractId": "upgrade.intent",
        "major": 2,
        "source": "Modules/factory-upgrade-intake/contracts/provided/upgrade.intent.v2.schema.json",
        "status": "proposed",
        "mode": "active",
        "ownerModule": "factory-upgrade-intake"
      }
    ],
    "consumed": []
  },
  "communication": {
    "inbound": [],
    "outbound": [
      {
        "peerModule": "factory-instruction-resolver",
        "contractId": "upgrade.intent",
        "major": 2,
        "direction": "outbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "none-validation-is-deterministic",
        "idempotencyKey": "intent_id:upgrade_intent_sha256",
        "authScope": "factory:instruction-resolver",
        "failureMode": "fail-closed-and-quarantine-intent"
      },
      {
        "peerModule": "factory-impact-analyzer",
        "contractId": "upgrade.intent",
        "major": 2,
        "direction": "outbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "none-validation-is-deterministic",
        "idempotencyKey": "intent_id:upgrade_intent_sha256",
        "authScope": "factory:impact-analyzer",
        "failureMode": "fail-closed-and-quarantine-intent"
      },
      {
        "peerModule": "factory-control-plane-host",
        "contractId": "upgrade.intent",
        "major": 2,
        "direction": "outbound",
        "transport": "command",
        "timeoutMs": 5000,
        "retryPolicy": "same-intent-id-and-upgrade-intent-sha256",
        "idempotencyKey": "intent_id:upgrade_intent_sha256",
        "authScope": "factory:host:orchestrate",
        "failureMode": "host-may-orchestrate-only-never-treat-expectations-as-scope-truth"
      }
    ]
  },
  "dependencies": [],
  "permissions": {
    "allowed": ["validate REQUESTED claim syntax against a verified Manifest ownership snapshot", "validate externally verified requester and selected approval bindings", "emit fixed v1 quarantine routing metadata"],
    "denied": ["production shell", "product repository write", "release approval", "production secrets", "device command"],
    "productionApproval": "human-required"
  },
  "data": {
    "ownedStores": [],
    "readModels": [],
    "privacyClasses": ["internal"],
    "retention": "WAITING_EXTERNAL: validated intents, full digests, key/nonce conflicts and decisions require the external Factory PostgreSQL event store",
    "export": "export the normalized intent, authority receipt identifiers, full digest and validation reasons without verification material or secrets",
    "correction": "submit a new intent revision; do not rewrite an accepted revision",
    "deletion": "remove non-audit payloads under the Factory retention policy while retaining non-sensitive digest, receipt and rejection proofs"
  },
  "security": {
    "trustBoundaries": ["trusted process composition root and external auth verifier", "exact-baseline Manifest ownership verifier", "versioned upgrade intent contract", "WAITING_EXTERNAL durable Host idempotency transaction"],
    "secretScopes": [],
    "untrustedInputs": ["AI-authored intent", "requested paths", "expected contract claims", "authorization fields", "wire JSON", "verification material before external verification"],
    "failClosedOn": ["R4", "unknown risk or stage", "non-canonical timestamp", "scope escape or glob", "authority-instance or receipt mismatch", "expired authentication or approval", "missing human approval", "self approval", "pending or rejected approval", "unknown contract major", "provider compat-read", "unknown or missing contract mode/status/change kind", "invalid retired status or reactivation", "duplicate or conflicting contract major", "Manifest snapshot mismatch", "component, approval-subject, quarantine-evidence or full-intent digest mismatch"],
    "policyIds": ["SOUL-ISO-001", "CMD-IDEMP-001", "RESULT-VERIFY-001", "GBRAIN-READBACK-001", "EDGE-NORESTART-001"]
  },
  "tests": {
    "requiredOutcome": "PASS",
    "failureOutcomes": ["FAIL", "SKIP", "PARTIAL", "NOT_RUN", "INFRA_ERROR", "NOT_APPLICABLE"],
    "suites": [
      {
        "id": "factory-upgrade-intake.unit",
        "type": "unit",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-upgrade-intake/tests/test_upgrade_intake.py",
        "environment": "CPython 3.12; process-composed authority fixtures, trusted clock, strict v2 codec, approval replay, Manifest snapshot binding, four change kinds, v1 quarantine, path/type/resource attacks, and explicit durable-ledger boundary",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      },
      {
        "id": "factory-upgrade-intake.contract",
        "type": "contract",
        "required": true,
        "command": "python3.12 -m unittest Modules/factory-upgrade-intake/tests/test_contracts.py",
        "environment": "CPython 3.12 with hash-locked jsonschema; owned v2 positive/negative corpus with independent Schema and production assertions, production-normalized output, frozen v1 bytes, and exact v2 source digest",
        "evidenceLevel": "REPOSITORY_STATIC_VERIFIED"
      }
    ]
  },
  "compatibility": {
    "policyRef": "governance/policies/compatibility-policy.yaml",
    "track": "factory",
    "moduleMajor": 0,
    "supportedContractMajors": {"upgrade.intent": [1, 2]},
    "unknownMajorBehavior": "reject",
    "missingMajorBehavior": "reject",
    "unknownModeBehavior": "reject",
    "missingModeBehavior": "reject"
  },
  "rollout": {
    "featureFlag": "factory_upgrade_intake_v2",
    "canary": "synthetic v2 claims through authority verification, Resolver baseline binding and Host durable idempotency in shadow; v1 remains quarantine-only and no production mutation occurs",
    "rollback": "route intake to the previous signed Factory BOM within five minutes",
    "killSwitch": "factory_disable_new_upgrade_intake"
  },
  "deviceGates": {
    "requiresWindows": false,
    "requiresZennoDroid": false,
    "requiresAdb": false,
    "minimumVerification": "REPOSITORY_STATIC_VERIFIED"
  },
  "agents": {
    "spec": "dps.agents/v1",
    "policyVersion": "1.0.0",
    "instructionsFile": "AGENTS.md",
    "manifestFile": "module.yaml",
    "receiptRequired": true
  }
}
