# L3: 操作层定义
# DPS v4.5 模块内的操作单元层级

level:
  id: l3
  name: 操作层
  priority: 3
  description: 模块内的独立操作单元，完成特定功能

scope:
  type: operation
  includes:
    - 单个操作的实现
    - 操作逻辑优化
    - 操作接口变更
    - 操作错误处理

