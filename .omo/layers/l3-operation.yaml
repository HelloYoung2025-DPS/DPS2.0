# 操作模板
templates:
  new_operation:
    id_format: "op-{module_short}-{number:03d}"
    required_fields:
      - name
      - module
      - description
      - entry_point
    optional_fields:
      - complexity
      - risk
      - steps
      - last_modified

# 成功标准
success_criteria:
  - 操作编译通过
  - 操作逻辑正确
  - 错误处理完整
  - 不影响其他操作

# 依赖关系
dependencies:
  parent_level: l2-module
  child_levels: [l4-step]
