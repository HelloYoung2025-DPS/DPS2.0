# 步骤类型分类
types:
  - type: variable_assignment
    description: 变量赋值
    examples:
      - "var x = value;"
      - "string name = GetName();"

  - type: function_call
    description: 函数调用
    examples:
      - "Execute(action);"
      - "Calculate(coords);"

  - type: conditional_check
    description: 条件判断
    examples:
      - "if (condition) return;"
      - "switch (value) { ... }"

  - type: loop_iteration
    description: 循环迭代
    examples:
      - "foreach (var item in list) { ... }"
      - "while (condition) { ... }"

  - type: error_handling
    description: 错误处理
    examples:
      - "try { ... } catch (Exception e) { ... }"
      - "if (error) return error;"

# 步骤模板
templates:
  new_step:
    id_format: "{operation_id}-{step_number:02d}"
    required_fields:
      - name
      - operation
      - module
      - description
      - code
    optional_fields:
      - complexity
      - risk
      - last_modified

# 步骤统计
statistics:
  total_steps: 100+
  by_type:
    variable_assignment: ~30
    function_call: ~40
    conditional_check: ~15
    loop_iteration: ~10
    error_handling: ~5
  by_complexity:
    high: ~15
    medium: ~35
    low: ~50
  by_risk:
    high: ~10
    medium: ~25
    low: ~65

# C# 5.0 语法约束检查
syntax_constraints:
  forbidden:
    - pattern: '$\"'
      alternative: 'string.Format()'
    - pattern: '?.'
      alternative: '显式 null 检查'
    - pattern: 'nameof('
      alternative: '硬编码字符串'
    - pattern: '??'
      alternative: '三元运算符 ? :'
  required:
    - 所有 I/O 操作必须包含 try-catch
    - 字符串拼接使用 string.Format() 或 +
    - null 检查使用 if (x == null)

# 成功标准
success_criteria:
  - 步骤语法正确
  - 步骤逻辑正确
  - 步骤可独立执行
  - 步骤无副作用（纯函数）
  - 符合 C# 5.0 语法约束

# 依赖关系
dependencies:
  parent_level: l3-operation
  child_levels: []

# L4 强制执行协议
change_protocol:
  gate_script: Tools/omo_guard/Invoke-OmoGate.ps1
  gate_phases:
    - Preflight: 开始实现前
    - Advance: 每个计划文件完成后
    - Postflight: 收尾与验证命令执行
  primary_files:
    - .omo/current-task/plan.md
    - .omo/modules/{ModuleName}.md
    - .omo/layers/l4-step.yaml
  edit_order:
    - 先更新计划与模块追踪文件
    - 再更新 l4-step.yaml 中对应 step / primitive 记录
    - 再修改 step 所属代码
    - 若影响 operation 契约，再回写 l3-operation.yaml 与 Config/Operations/*
    - 最后更新 CHANGELOG.md
  validation_order:
    - 先做局部逻辑/语法验证
    - 再做受影响 operation 的针对性验证
    - 若 step 被多个模块复用，再做模块级回归
  stop_conditions:
    - 未执行 Gate Preflight，不得修改 step / primitive
    - 未记录 step 变化，不得改 primitive 语义
    - 若会影响上层契约，未回写 L3 不得结束任务
coding_rules:
  - 最小改动，禁止顺手改 unrelated 逻辑
  - 明确 success / retry / skip / abort 路径
  - 不新增重复 primitive
  - 若新增 I/O，必须补错误处理
  - 原子动作下沉到 ZD 后必须保持与现有 step action 语义兼容 (ADR-015)
  - 双层成功判定: ZD 判执行成功，编排器判业务成功 (ADR-015)
