# L4: 步骤层定义
# DPS v4.5 最小执行单元层级

level:
  id: l4
  name: 步骤层
  priority: 4
  description: 最小的可执行单元，不可再分的代码片段

scope:
  type: step
  includes:
    - 单个代码语句或小块代码
    - 变量赋值
    - 函数调用
    - 条件判断
    - 循环迭代

# 步骤清单（按操作分组）
steps:

  # === SessionRunner.Initialize() 步骤 ===
  - id: op-sr-001-01
    name: create-droid-instance
    operation: initialize-session
    module: SessionRunner
    description: 创建 ZennoDroid DroidInstance 对象
    code: "var instance = new DroidInstance(deviceId);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-001-02
    name: load-app-config
    operation: initialize-session
    module: SessionRunner
    description: 读取 app.config 配置文件
    code: "var config = CoreHelper.ReadConfig(deviceId);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-001-03
    name: validate-session
    operation: initialize-session
    module: SessionRunner
    description: 验证会话状态是否有效
    code: "if (!instance.IsActive) return false;"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === SessionRunner.LoadBehaviorConfig() 步骤 ===
  - id: op-sr-002-01
    name: read-behavior-file
    operation: load-behavior-config
    module: SessionRunner
    description: 读取 BehaviorConfig.json 文件内容
    code: "string json = FileHelper.ReadAllText(Config.BehaviorConfig);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-002-02
    name: parse-behavior-json
    operation: load-behavior-config
    module: SessionRunner
    description: 解析行为配置 JSON
    code: "var weights = JsonHelper.GetNestedValue(json, \"action_weights\");"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === SessionRunner.ExecuteSequence() 步骤 ===
  - id: op-sr-003-01
    name: select-next-action
    operation: execute-action-sequence
    module: SessionRunner
    description: 加权随机选择下一个动作
    code: "string action = WeightedRandom.Select(weights);"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-003-02
    name: apply-humanization
    operation: execute-action-sequence
    module: SessionRunner
    description: 应用人性化延迟
    code: "HumanizationEngine.ApplyDelay(action);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-003-03
    name: execute-action
    operation: execute-action-sequence
    module: SessionRunner
    description: 执行具体动作
    code: "var result = ActionExecutor.Execute(action);"
    complexity: medium
    risk: medium
    last_modified: 2026-02-27

  - id: op-sr-003-04
    name: update-fatigue
    operation: execute-action-sequence
    module: SessionRunner
    description: 更新疲劳状态
    code: "fatigueTracker.Update(action);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === RuleEngine.Evaluate() 步骤 ===
  - id: op-re-003-01
    name: calculate-hot-score
    operation: evaluate-post
    module: RuleEngine
    description: 计算热度分（时间衰减）
    code: "double hotScore = CalculateHotScore(postJson);"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  - id: op-re-003-02
    name: calculate-relevance-score
    operation: evaluate-post
    module: RuleEngine
    description: 计算相关性分
    code: "double relevanceScore = CalculateRelevanceScore(postJson, interests);"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  - id: op-re-003-03
    name: compare-threshold
    operation: evaluate-post
    module: RuleEngine
    description: 与阈值对比决定是否互动
    code: "if (compositeScore < threshold) return false;"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === ActionExecutor.HandleFind() 步骤 ===
  - id: op-ae-003-01
    name: parse-selector
    operation: handle-find-command
    module: ActionExecutor
    description: 解析 UI 选择器
    code: "string selector = SelectorEngine.GetSelector(platform, element);"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  # === ActionExecutor.HandleTap() 步骤 ===
  - id: op-ae-004-01
    name: calculate-center-coords
    operation: handle-tap-command
    module: ActionExecutor
    description: 计算中心坐标
    code: "int centerX = (x1 + x2) / 2; int centerY = (y1 + y2) / 2;"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === ActionExecutor.HandleVerify() 步骤 ===
  - id: op-ae-006-01
    name: check-element-exists
    operation: handle-verify-command
    module: ActionExecutor
    description: 检查元素是否存在
    code: "bool exists = UILocator.ElementExists(selector);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-ae-006-02
    name: handle-failure-retry
    operation: handle-verify-command
    module: ActionExecutor
    description: 处理失败重试
    code: "if (!exists && onFail == \"retry\") { retryCount++; }"
    complexity: medium
    risk: medium
    last_modified: 2026-02-27

  # === IntentTranslator.Translate() 步骤 ===
  - id: op-it-001-01
    name: parse-intent-type
    operation: translate-intent
    module: IntentTranslator
    description: 解析意图类型
    code: "IntentType type = intent.Type;"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-it-001-02
    name: lookup-selector
    operation: translate-intent
    module: IntentTranslator
    description: 查找对应选择器
    code: "var selector = SelectorEngine.GetSelector(platform, type);"
    complexity: medium
    risk: medium
    last_modified: 2026-02-27

  - id: op-it-001-03
    name: build-command-chain
    operation: translate-intent
    module: IntentTranslator
    description: 构建命令执行链
    code: "var commands = BuildCommandChain(selector);"
    complexity: high
    risk: high
    last_modified: 2026-02-27

  # === MemoryManager.Record() 步骤 ===
  - id: op-mm-001-01
    name: serialize-interaction
    operation: record-interaction
    module: MemoryManager
    description: 序列化交互数据
    code: "string json = JsonHelper.SetJsonValue(\"\", \"post_id\", postId);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-mm-001-02
    name: append-to-memory-file
    operation: record-interaction
    module: MemoryManager
    description: 追加到记忆文件
    code: "FileHelper.Append(memoryPath, json);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  # === PersonaCreate.Generate() 步骤 ===
  - id: op-pc-001-01
    name: read-ai-config
    operation: generate-persona
    module: PersonaCreate
    description: 读取 AI 配置
    code: "var aiConfig = JsonHelper.GetJsonValue(AIConfig.json, \"gemini\");"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-pc-001-02
    name: call-ai-api
    operation: generate-persona
    module: PersonaCreate
    description: 调用 AI API
    code: "string response = AIService.CallAI(prompt, aiConfig);"
    complexity: medium
    risk: medium
    last_modified: 2026-02-27

  - id: op-pc-001-03
    name: parse-and-validate
    operation: generate-persona
    module: PersonaCreate
    description: 解析并验证 JSON
    code: "if (!ValidatePersonaJson(response)) return null;"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  # === AIService 调用步骤 ===
  - id: op-ai-001-01
    name: build-http-request
    operation: call-gemini
    module: AIService
    description: 构建 HTTP 请求
    code: "var request = BuildHttpRequest(apiUrl, apiKey, prompt);"
    complexity: medium
    risk: low
    last_modified: 2026-02-27

  - id: op-ai-001-02
    name: send-and-parse-response
    operation: call-gemini
    module: AIService
    description: 发送请求并解析响应
    code: "var response = httpClient.Send(request); return ParseResponse(response);"
    complexity: medium
    risk: medium
    last_modified: 2026-02-27

# 步骤类型分类
types:
  - type: variable_assignment
    description: 变量赋值
    examples:
      - "var x = value;"
      - "string name = GetName();"

  - type: function_call
    description: 函数调用
    examples:
      - "Execute(action);"
      - "Calculate(coords);"

  - type: conditional_check
    description: 条件判断
    examples:
      - "if (condition) return;"
      - "switch (value) { ... }"

  - type: loop_iteration
    description: 循环迭代
    examples:
      - "foreach (var item in list) { ... }"
      - "while (condition) { ... }"

  - type: error_handling
    description: 错误处理
    examples:
      - "try { ... } catch (Exception e) { ... }"
      - "if (error) return error;"

# 步骤模板
templates:
  new_step:
    id_format: "{operation_id}-{step_number:02d}"
    required_fields:
      - name
      - operation
      - module
      - description
      - code
    optional_fields:
      - complexity
      - risk
      - last_modified

# 步骤统计
statistics:
  total_steps: 100+
  by_type:
    variable_assignment: ~30
    function_call: ~40
    conditional_check: ~15
    loop_iteration: ~10
    error_handling: ~5
  by_complexity:
    high: ~15
    medium: ~35
    low: ~50
  by_risk:
    high: ~10
    medium: ~25
    low: ~65

# C# 5.0 语法约束检查
syntax_constraints:
  forbidden:
    - pattern: '$\"'
      alternative: 'string.Format()'
    - pattern: '?.'
      alternative: '显式 null 检查'
    - pattern: 'nameof('
      alternative: '硬编码字符串'
    - pattern: '??'
      alternative: '三元运算符 ? :'
  required:
    - 所有 I/O 操作必须包含 try-catch
    - 字符串拼接使用 string.Format() 或 +
    - null 检查使用 if (x == null)

# 成功标准
success_criteria:
  - 步骤语法正确
  - 步骤逻辑正确
  - 步骤可独立执行
  - 步骤无副作用（纯函数）
  - 符合 C# 5.0 语法约束

# 依赖关系
dependencies:
  parent_level: l3-operation
  child_levels: []
