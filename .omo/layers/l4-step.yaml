    complexity: medium
    risk: low
    last_modified: 2026-03-08

  - id: op-sr-001-05
    name: plan-pre-session-actions
    operation: initialize-session
    module: SessionRunner
    description: 根据检测到的页面状态规划预设动作序列（剧本）
    code: "List<string> preActions = PlanPreSessionActions(_currentPage);"
    complexity: medium
    risk: low
    last_modified: 2026-03-08

  - id: op-sr-001-06
    name: execute-pre-session-actions
    operation: initialize-session
    module: SessionRunner
    description: 在主循环前执行规划的预设动作序列
    code: "ExecutePreSessionActions(preActions, platformName, projectRoot);"
