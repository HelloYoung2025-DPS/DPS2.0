# L4: 步骤层定义
# DPS v4.5 最小执行单元层级

level:
  id: l4
  name: 步骤层
  priority: 4
  description: 最小的可执行单元，不可再分的代码片段

scope:
  type: step
  includes:
    - 单个代码语句或小块代码
    - 变量赋值
    - 函数调用
    - 条件判断
    - 循环迭代

# 步骤清单（按操作分组）
steps:

  # === SessionRunner.Initialize() 步骤 ===
  - id: op-sr-001-01
    name: create-droid-instance
    operation: initialize-session
    module: SessionRunner
    description: 创建 ZennoDroid DroidInstance 对象
    code: "var instance = new DroidInstance(deviceId);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-001-02
    name: load-app-config
    operation: initialize-session
    module: SessionRunner
    description: 读取 app.config 配置文件
    code: "var config = CoreHelper.ReadConfig(deviceId);"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-001-03
    name: validate-session
    operation: initialize-session
    module: SessionRunner
    description: 验证会话状态是否有效
    code: "if (!instance.IsActive) return false;"
    complexity: low
    risk: low
    last_modified: 2026-02-27

  - id: op-sr-001-04
    name: detect-initial-page
    operation: initialize-session
    module: SessionRunner
    description: APP 打开后检测当前所处页面（首页/帖子/频道/其他）
