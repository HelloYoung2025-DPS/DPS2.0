# L1: 项目层定义
# DPS v4.5 整体项目层级

level:
  id: l1
  name: 项目层
  priority: 1
  description: 整个 DPS_v4.5 项目的全局管理和控制

scope:
  type: global
  includes:
    - 全局架构升级
    - 多模块协同优化
    - 技术栈迁移
    - 性能全面优化
    - 安全性整体提升
    - 跨平台扩展

# 项目级元数据
metadata:
  project_name: DPS_v4.5
  project_type: CSharpAutomationFramework
  full_name: Dynamic Persona Simulation
  version: 4.5.8
  created_date: 2026-01-01
  last_updated: 2026-02-28
  total_files: 77
  total_lines: ~24100
  language_version: C# 5.0 (Modules/), C# 7.0+ (ZDProjects/)
  framework: .NET Framework 4.5
  platform: ZennoDroid 7.x+ on Windows

# 架构信息
architecture:
  pattern: Intent-Based Execution
  layers:
    - DPS (大脑): 感知、记忆、决策
    - ZennoDroid (手): 元素定位、拟人化执行、异常处理
  core_abstractions:
    - Intent: 高层操作意图
    - ZDCommand: ZennoDroid 物理命令
    - ZDResult: 统一执行结果
    - IntentTranslator: 意图翻译器

# 支持的平台
platforms:
  enabled:
    - name: Reddit
      module: Platforms/Reddit/RedditModule.cs
      status: stable
      operations: 6 (Initialize, Browse, Like, Comment, Follow, Share)
    - name: Instagram
      module: Platforms/Instagram/InstagramModule.cs
      status: stable
      operations: 6 (Initialize, Browse, Like, Comment, Follow, Share)
    - name: BabyCenter
      module: Platforms/BabyCenter/BabyCenterModule.cs
      status: stable
      operations: 6 (Initialize, Browse, Like, Comment, Follow, Share)
  pending:
    - name: TikTok
      status: config_ready, module_missing
    - name: Facebook
      status: config_ready, module_missing

# 目录结构
directories:
  - path: .omo/
    purpose: .omo 2.0 工作流状态管理
  - path: Config/
    purpose: 14 个 JSON 配置文件
    files:
      - AIConfig.json
      - BehaviorConfig.json
      - DecisionConfig.json
      - PlatformsConfig.json
      - StageConfig.json
      - Operations/
      - IntentMappings/
  - path: Core/
    purpose: ZD 脚本层引擎
    files: 5
  - path: Modules/
    purpose: 业务逻辑模块
    files: 14 .cs + Core/ 14 .cs
  - path: Platforms/
    purpose: 平台实现
    files: 3 platforms
  - path: Extensions/
    purpose: 可插拔扩展
  - path: ZDProjects/
    purpose: ZD Own Code 入口脚本
    files: ModuleLoader.cs + *_OwnCode.cs

# 子层级引用
sub_levels:
  - l2-module
  - l3-operation
  - l4-step

# 项目级操作
operations:
  - id: op-l1-001
    name: 全局架构升级
    description: 升级整个项目架构到新的设计模式
    complexity: high
    risk: high
    estimated_hours: 40+
    status: available

  - id: op-l1-002
    name: 性能全面优化
    description: 对所有模块进行性能分析和优化
    complexity: medium
    risk: medium
    estimated_hours: 20+
    status: available

  - id: op-l1-003
    name: 接入新平台
    description: 接入 TikTok 或 Facebook 平台
    complexity: medium
    risk: medium
    estimated_hours: 16+
    status: available

  - id: op-l1-004
    name: Intent 系统重构
    description: 重构 Intent-Based Execution 架构
    complexity: high
    risk: high
    estimated_hours: 30+
    status: completed
    completed_date: 2026-02-27

# 成功标准
success_criteria:
  - 所有模块编译通过
  - E2E 测试通过率 >= 95%
  - 无回归缺陷
  - 文档完整更新
  - 符合 C# 5.0 语法约束

# 技术约束
constraints:
  csharp_version: "5.0"
  forbidden_syntax:
    - 字符串插值: "$\"\""
    - null条件运算符: "?."
    - nameof表达式: "nameof()"
    - null合并运算符: "??"
  required_patterns:
    - 字符串拼接: "string.Format() 或 +"
    - null检查: "显式 if (x == null)"
    - 异常处理: "所有 I/O 操作必须包含 try-catch"

# 依赖项
dependencies:
  external:
    - name: ZennoDroid
      version: 7.x+
      type: Runtime
    - name: .NET Framework
      version: 4.5
      type: Runtime
    - name: Gemini API
      type: AI Service
    - name: Claude API
      type: AI Service
    - name: GPT API
      type: AI Service
  internal: []

# 已知技术债
technical_debt:
  - item: Extensions/Hooks/ 目录为空
    priority: low
    estimated_cost: 1-2 天
  - item: 行为配置命名不一致
    priority: medium
    estimated_cost: 1 小时
  - item: Modules/Decision/ 子目录占位
    priority: low
    estimated_cost: 待评估
  - item: Modules/Persona/ 子目录占位
    priority: low
    estimated_cost: 待评估

# 7 阶段生命周期
lifecycle_stages:
  - code: TTC
    name: 备孕期
    sessions_per_day: 6
    minutes_per_session: 12
  - code: T1
    name: 孕早期
    sessions_per_day: 7
    minutes_per_session: 10
  - code: T2
    name: 孕中期
    sessions_per_day: 7
    minutes_per_session: 12
  - code: T3
    name: 孕晚期
    sessions_per_day: 6
    minutes_per_session: 11
  - code: PP0
    name: 产后早期
    sessions_per_day: 10
    minutes_per_session: 7
  - code: PP1
    name: 产后中期
    sessions_per_day: 8
    minutes_per_session: 9
  - code: NP
    name: 育儿期
    sessions_per_day: 6
    minutes_per_session: 12
