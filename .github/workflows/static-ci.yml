name: DPS Phase 0 Static Gate

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase0:
    name: Repository static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out complete history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.13"

      - name: Set up pinned Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.18.0"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.301"

      - name: Install hash-locked Python gate dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --require-hashes
          --requirement requirements-ci.txt

      - name: Run M1C module-impact suite
        run: >-
          python -I -m unittest discover
          -s Tests/ci
          -p test_module_impact.py
          -v

      - name: Run the unique Phase 0 gate
        env:
          DPS_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python Tools/ci/run_phase0_gate.py
          --node "$(command -v node)"
          --evidence Reports/ci/phase0-evidence/phase0-evidence.json

      - name: Upload raw Phase 0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dps-phase0-evidence-${{ github.sha }}
          path: |
            Reports/ci/phase0-evidence/
            Reports/ci/playwright-config.json
          if-no-files-found: error
          retention-days: 30
