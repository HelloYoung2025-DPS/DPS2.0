# .omo Configuration
# This file enables OhMyOpenCode workflow standards

version: 1.0
workflow: plan-first

# Workflow Rules:
# 1. MUST create plan.md before any implementation
# 2. MUST ask clarifying questions if anything is unclear
# 3. MUST get user approval before executing plan
# 4. MUST document all changes in CHANGELOG.md

# Project Constraints:
language: csharp
version: 5.0
framework: .NET 4.5
platform: ZennoDroid
layered_workflow: enforced
layered_edit_order: L1 -> L2 -> L3 -> L4
layered_validation_order: L4 -> L3 -> L2 -> L1

# Mandatory Protocol Files:
mandatory_protocols:
  - .omo/layers/EXECUTION_PROTOCOL.md
  - .omo/modules/WORKFLOW.md
mandatory_gate_script: Tools/omo_guard/Invoke-OmoGate.ps1
mandatory_gate_phases:
  - Preflight
  - Advance
  - Postflight

# Change Control:
require_layer_classification: true
require_layer_registry_update_before_code: true
require_module_tracker_for_l2_l4: true
require_validation_before_changelog: true
require_changelog_last: true
require_gate_preflight: true
require_gate_advance_per_file: true
require_gate_postflight: true

# Code Standards:
- No modern C# syntax (no $"", ?., nameof(), etc.)
- Maintain backward compatibility
- Follow existing codebase patterns
- Add error handling to all I/O operations
- Prefer config-driven changes before module code changes
- Ask targeted clarifying questions if layer ownership is unclear
- Run the OMO Gate script before and after implementation
